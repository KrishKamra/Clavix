[project]
name = "clavix"
version = "0.1.0"
description = "Deterministic, closed-loop multimodal voice-to-action desktop automation engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyautogui>=0.9.54",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# One extra per teammate module. Install with e.g. `uv sync --extra acoustic`.
acoustic = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "av<19",  # faster-whisper 1.2.1's decode_audio passes metadata_errors, removed in PyAV 19
]
grounding = [
    "uiautomation>=2.0.18; sys_platform == 'win32'",
]
feedback = [
    "pyttsx3>=2.90",
    "pynput>=1.7.6",
]

[project.scripts]
clavix = "clavix.cli:main"
clavix-bench = "clavix.evaluation.harness:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clavix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: needs downloaded models or audio hardware (deselect with -m 'not slow')",
    "desktop: drives the real desktop: windows, mouse, speakers (deselect with -m 'not desktop')",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # spec snippets keep aligned comments

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",    # assert is fine in tests and invariants
    "S607",    # system tools (tasklist, ps, taskkill, xdg-open) are resolved from PATH by design
    "UP007",   # Optional[...] is used deliberately in schemas for readability
    "UP045",
    "RUF002",  # en dashes in docstrings
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"clavix/testing/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clavix"]
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyautogui", "pygetwindow", "uiautomation", "faster_whisper", "sounddevice", "pyttsx3", "pynput.*"]
ignore_missing_imports = true
