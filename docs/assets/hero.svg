<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-labelledby="t d">
  <title id="t">Clavix acting on a spoken command</title>
  <desc id="d">The Clavix HUD types the spoken command "open notepad and click the file menu", moves through the Hear, Think, Act and Verify stages while a latency bar fills in, and checks off the two plan steps.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171D2C"/>
      <stop offset="1" stop-color="#0C1019"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
    <clipPath id="field"><rect x="31" y="75" width="816" height="56" rx="12"/></clipPath>
    <style>
      text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; }
      .a { animation-duration: 10s; animation-iteration-count: infinite; animation-fill-mode: both; }
      .grow { transform-box: fill-box; transform-origin: 0 50%; }

      .loop  { animation-name: loop; }
      .cover { animation-name: type; }
      .caret { animation-name: type; }
      .blink { animation: blink 1s steps(1) infinite; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; }
      .dot { animation-name: dot; }
      .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; } .c4 { animation-name: c4; }
      .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; } .b4 { animation-name: b4; }
      .l1 { animation-name: c2; } .l2 { animation-name: c3; } .l3 { animation-name: c4; }
      .p1 { animation-name: p1; } .k1 { animation-name: k1; } .p2 { animation-name: p2; } .k2 { animation-name: k2; }
      .done { animation-name: done; }

      @keyframes loop  { 0%, 94% { opacity: 1 } 97% { opacity: 0 } 100% { opacity: 1 } }
      @keyframes type  { 0%, 3% { transform: translateX(0); animation-timing-function: steps(38, end) } 28%, 100% { transform: translateX(517px) } }
      @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes s1 { 0%, 29% { opacity: 1 } 30%, 100% { opacity: 0 } }
      @keyframes s2 { 0%, 29% { opacity: 0 } 30%, 47% { opacity: 1 } 48%, 100% { opacity: 0 } }
      @keyframes s3 { 0%, 47% { opacity: 0 } 48%, 67% { opacity: 1 } 68%, 100% { opacity: 0 } }
      @keyframes s4 { 0%, 67% { opacity: 0 } 68%, 100% { opacity: 1 } }
      @keyframes dot { 0%, 29% { fill: #4A90E2 } 30%, 47% { fill: #E0A030 } 48%, 67% { fill: #1FA884 } 68%, 100% { fill: #A57BD0 } }
      @keyframes c1 { 0%, 2% { opacity: 0 } 4%, 100% { opacity: 1 } }
      @keyframes c2 { 0%, 29% { opacity: 0 } 31%, 100% { opacity: 1 } }
      @keyframes c3 { 0%, 47% { opacity: 0 } 49%, 100% { opacity: 1 } }
      @keyframes c4 { 0%, 67% { opacity: 0 } 69%, 100% { opacity: 1 } }
      @keyframes b1 { 0%, 3% { transform: scaleX(0) } 28%, 100% { transform: scaleX(1) } }
      @keyframes b2 { 0%, 30% { transform: scaleX(0) } 47%, 100% { transform: scaleX(1) } }
      @keyframes b3 { 0%, 48% { transform: scaleX(0) } 66%, 100% { transform: scaleX(1) } }
      @keyframes b4 { 0%, 68% { transform: scaleX(0) } 72%, 100% { transform: scaleX(1) } }
      @keyframes p1 { 0%, 49% { opacity: 0 } 51%, 100% { opacity: 1 } }
      @keyframes k1 { 0%, 56% { opacity: 0 } 58%, 100% { opacity: 1 } }
      @keyframes p2 { 0%, 57% { opacity: 0 } 59%, 100% { opacity: 1 } }
      @keyframes k2 { 0%, 65% { opacity: 0 } 67%, 100% { opacity: 1 } }
      @keyframes done { 0%, 71% { opacity: 0; transform: translateY(4px) } 74%, 100% { opacity: 1; transform: translateY(0) } }

      @media (prefers-reduced-motion: reduce) {
        .a, .blink { animation: none; }
        .cover { transform: translateX(517px); }
        .caret, .s1, .s2, .s3 { opacity: 0; }
      }
    </style>
  </defs>

  <!-- glass card -->
  <rect x="1" y="1" width="878" height="260" rx="22" fill="url(#card)"/>
  <rect x="1.5" y="1.5" width="877" height="259" rx="21.5" fill="none" stroke="url(#rim)"/>

  <!-- mark + wordmark -->
  <g transform="translate(30 26) scale(.5)" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="6">
    <path d="M10 26v12" stroke="#4A90E2"/><path d="M20 17v30" stroke="#E0A030"/>
    <path d="M30 24v16" stroke="#1FA884"/><path d="M38 33l6 7 10-17" stroke="#A57BD0"/>
  </g>
  <text x="68" y="48" font-size="15" font-weight="700" letter-spacing="3" fill="#E8ECF4">CLAVIX</text>

  <g class="a loop">
    <!-- status -->
    <circle class="a dot" cx="160" cy="43" r="5" fill="#4A90E2"/>
    <text class="a s1" x="174" y="48" font-size="14" fill="#9AA3B5">Hearing…</text>
    <text class="a s2" x="174" y="48" font-size="14" fill="#9AA3B5">Thinking…</text>
    <text class="a s3" x="174" y="48" font-size="14" fill="#9AA3B5">Acting…</text>
    <text class="a s4" x="174" y="48" font-size="14" fill="#C9B6E4">Done, and verified</text>

    <!-- stage chips -->
    <g font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      <g fill="none" stroke="#2A3142">
        <rect x="502" y="28" width="80" height="26" rx="13"/><rect x="590" y="28" width="80" height="26" rx="13"/>
        <rect x="678" y="28" width="80" height="26" rx="13"/><rect x="766" y="28" width="82" height="26" rx="13"/>
      </g>
      <g fill="#5C6577"><text x="542" y="45">HEAR</text><text x="630" y="45">THINK</text><text x="718" y="45">ACT</text><text x="807" y="45">VERIFY</text></g>
      <g class="a c1"><rect x="502" y="28" width="80" height="26" rx="13" fill="#4A90E2"/><text x="542" y="45" fill="#FFFFFF">HEAR</text></g>
      <g class="a c2"><rect x="590" y="28" width="80" height="26" rx="13" fill="#E0A030"/><text x="630" y="45" fill="#FFFFFF">THINK</text></g>
      <g class="a c3"><rect x="678" y="28" width="80" height="26" rx="13" fill="#1FA884"/><text x="718" y="45" fill="#FFFFFF">ACT</text></g>
      <g class="a c4"><rect x="766" y="28" width="82" height="26" rx="13" fill="#A57BD0"/><text x="807" y="45" fill="#FFFFFF">VERIFY</text></g>
    </g>

    <!-- transcript, typed -->
    <rect x="30" y="74" width="818" height="58" rx="13" fill="#0A0D15" stroke="#FFFFFF" stroke-opacity=".06"/>
    <text class="mono" x="52" y="111" font-size="24" fill="#F2F4F8" textLength="517" lengthAdjust="spacingAndGlyphs">“open notepad and click the file menu”</text>
    <g clip-path="url(#field)"><rect class="a cover" x="48" y="84" width="540" height="40" fill="#0A0D15"/></g>
    <g class="a caret"><rect class="blink" x="51" y="88" width="2.5" height="29" rx="1" fill="#4A90E2"/></g>

    <!-- latency bar, filled stage by stage -->
    <rect x="30" y="148" width="818" height="6" rx="3" fill="#1C2231"/>
    <rect class="a b1 grow" x="30" y="148" width="64" height="6" rx="3" fill="#4A90E2"/>
    <rect class="a b2 grow" x="96" y="148" width="560" height="6" rx="3" fill="#E0A030"/>
    <rect class="a b3 grow" x="658" y="148" width="120" height="6" rx="3" fill="#1FA884"/>
    <rect class="a b4 grow" x="780" y="148" width="68" height="6" rx="3" fill="#A57BD0"/>
    <g font-size="12" fill="#7D879A">
      <g class="a c1"><circle cx="34" cy="174" r="3" fill="#4A90E2"/><text x="42" y="178">Hear 0.4 s</text></g>
      <g class="a l1"><circle cx="126" cy="174" r="3" fill="#E0A030"/><text x="134" y="178">Think 9.9 s · local llama3:8b</text></g>
      <g class="a l2"><circle cx="314" cy="174" r="3" fill="#1FA884"/><text x="322" y="178">Act 0.7 s · UI Automation</text></g>
      <g class="a l3"><circle cx="490" cy="174" r="3" fill="#A57BD0"/><text x="498" y="178">Verified against OS state</text></g>
    </g>

    <!-- plan steps -->
    <g font-size="15" fill="#D5DAE4">
      <g class="a p1">
        <circle cx="40" cy="209" r="8" fill="none" stroke="#3A4256" stroke-width="2"/>
        <text x="58" y="214">Run <tspan class="mono" fill="#FFFFFF">notepad</tspan></text>
      </g>
      <g class="a k1"><circle cx="40" cy="209" r="9" fill="#1FA884"/><path d="M36 209l3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a p2">
        <circle cx="40" cy="237" r="8" fill="none" stroke="#3A4256" stroke-width="2"/>
        <text x="58" y="242">Click <tspan class="mono" fill="#FFFFFF">File</tspan></text>
      </g>
      <g class="a k2"><circle cx="40" cy="237" r="9" fill="#1FA884"/><path d="M36 237l3 3 5-6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>

    <!-- result -->
    <g class="a done" text-anchor="end">
      <text x="848" y="216" font-size="22" font-weight="700" fill="#FFFFFF">2 / 2 steps verified</text>
      <text x="848" y="240" font-size="13" fill="#7D879A">fully on-device · no cloud calls</text>
    </g>
  </g>
</svg>
